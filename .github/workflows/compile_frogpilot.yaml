name: Compile FrogPilot
run-name: Compile ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      not_vetted:
        description: This branch is not vetted
        type: boolean
      publish_custom_branch:
        description: Custom branch name
        type: string
      publish_frogpilot:
        description: Push to FrogPilot
        type: boolean
      publish_staging:
        description: Push to FrogPilot-Staging
        type: boolean
      publish_testing:
        description: Push to FrogPilot-Testing
        type: boolean
      runner:
        default: c3
        description: Select runner
        options: [c3, c3x]
        type: choice

env:
  BUILD_DIR: /data/openpilot
  SOURCE_DIR: /data/frogpilot_source

  GIT_EMAIL: ${{ vars.GIT_EMAIL }}
  GIT_NAME: ${{ vars.GIT_NAME }}

  BRANCH_RELEASE: ${{ vars.BRANCH_RELEASE }}
  BRANCH_STAGING: ${{ vars.BRANCH_STAGING }}
  BRANCH_TESTING: ${{ vars.BRANCH_TESTING }}
  CUSTOM_BRANCH: ${{ inputs.publish_custom_branch }}

  COMPILE_COMMIT: ${{ vars.COMPILE_COMMIT }}

permissions: {}

concurrency: compile-frogpilot

jobs:
  build_and_push:
    name: Compile FrogPilot
    concurrency:
      group: frogpilot-branch-push
      queue: max
    runs-on: [self-hosted, "${{ inputs.runner }}"]
    timeout-minutes: 180
    defaults: {run: {shell: bash}}
    steps:
      - name: Set up source
        run: |
          : "${COMPILE_COMMIT:?COMPILE_COMMIT is required}" "${GIT_NAME:?GIT_NAME is required}" "${GIT_EMAIL:?GIT_EMAIL is required}"

          sudo rm -rf "$BUILD_DIR" "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          git clone --filter=blob:none --no-checkout --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BUILD_DIR"

          cd "$BUILD_DIR"
          git checkout -B "$GITHUB_REF_NAME" "refs/remotes/origin/$GITHUB_REF_NAME"
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "$GITHUB_REF_NAME moved since dispatch — dispatch again."
            exit 1
          fi

          if [[ ! -f release/release_files.py ]]; then
            echo "No release/release_files.py — source branch already compiled?"
            exit 1
          fi

          targets=("$GITHUB_REF_NAME")
          ${{ inputs.publish_frogpilot }} && targets+=("$BRANCH_RELEASE")
          ${{ inputs.publish_staging }} && targets+=("$BRANCH_STAGING")
          ${{ inputs.publish_testing }} && targets+=("$BRANCH_TESTING")
          [[ -n "$CUSTOM_BRANCH" ]] && targets+=("$CUSTOM_BRANCH")

          for target in "${targets[@]}"; do
            if [[ -z "$target" || "$(git check-ref-format --branch "$target")" != "$target" ]]; then
              echo "Invalid branch name: $target" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$target" "$(git rev-parse --verify --quiet "refs/remotes/origin/$target")"
          done | sort -u > "$RUNNER_TEMP/targets"

          if ! { [[ " ${targets[*]} " == *" $BRANCH_STAGING "* ]] &&
                 git show "refs/remotes/origin/$BRANCH_STAGING:.github/update_date" > "$RUNNER_TEMP/update_date" 2>/dev/null; }
          then
            rm -f "$RUNNER_TEMP/update_date"
          fi

      - name: Build source
        run: |
          cd "$BUILD_DIR"
          export PYTHONPATH="$BUILD_DIR"

          jobs=$(nproc)
          scons -j"$jobs" --minimal || scons -j"$((jobs / 2))" --minimal || scons -j1 --minimal

      - name: Prepare release
        run: |
          find "$BUILD_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec mv -t "$SOURCE_DIR" {} +

          cd "$SOURCE_DIR"
          python3 release/release_files.py | xargs -d '\n' cp -pR --parents -t "$BUILD_DIR"
          cp -p --parents -t "$BUILD_DIR" \
            tinygrad_repo/examples/openpilot/compile3.py \
            .github/workflows/{compile_frogpilot,review_pull_request,schedule_update,update_pr_branch,update_release_branch}.yaml

          if [[ -f "$RUNNER_TEMP/update_date" ]]; then
            cp -p "$RUNNER_TEMP/update_date" "$BUILD_DIR/.github/update_date"
          fi

          cd "$BUILD_DIR"
          rm -f not_vetted
          if ${{ inputs.not_vetted }}; then
            touch not_vetted
          fi

          rm -rf \
            .sconsign.dblite \
            frogpilot/classic_modeld/models/dmonitoring_model_q.dlc \
            frogpilot/{classic,tinygrad}_modeld/{dmonitoringmodeld.py,models/dmonitoring_model.current} \
            frogpilot/tinygrad_modeld/models/dmonitoring_model_tinygrad.pkl \
            panda/docs \
            release \
            selfdrive/debug \
            Jenkinsfile

          find . -path './.git' -prune -o -type d \( \
            -name '__pycache__' -o \
            -name test -o \
            -name tests \
          \) -prune -exec rm -rf {} +

          find . -path './.git' -prune -o -type f \( \
            \( -name '*.a' ! -path './third_party/libyuv/*' \) -o \
            \( -name '*.md' ! -name RELEASES.md ! -path './README.md' ! -path './SECURITY.md' ! -path './docs/*' \) -o \
            -name '*.o' -o -name '*.onnx' -o -name '*.os' -o -name '*_test.py' -o \
            -name conftest.py -o -name 'moc_*' -o -name 'test_*.py' \
          \) -exec rm -f {} +

          git ls-files -z --others \
            '*.[ch]' '*.c++' '*.cc' '*.cpp' '*.elf' '*.pxd' '*.qm' '*.qrc' \
            body/board/obj/body.bin \
            panda/board/jungle/obj/panda_jungle{,_h7}.bin \
            panda/board/obj/panda{,_h7}.bin \
            panda/board/obj/version \
            selfdrive/controls/lib/{lateral,longitudinal}_mpc_lib/acados_ocp_*.json \
            selfdrive/controls/lib/{lateral,longitudinal}_mpc_lib/c_generated_code/Makefile |
            xargs -0 rm -f

          git checkout -- '*LICENSE'
          find panda/board -type f \
            ! -name '__init__.py' \
            ! -name 'bootstub.panda.bin' \
            ! -name 'bootstub.panda_h7.bin' \
            ! -name 'panda.bin.signed' \
            ! -name 'panda_h7.bin.signed' \
            -delete

          find third_party -name '*Darwin*' -prune -exec rm -rf {} +
          find third_party -name '*x86*' -prune -exec rm -rf {} +

          touch prebuilt
          git add --all --force
          git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" \
            commit -m "$COMPILE_COMMIT"

      - name: Publish release
        env:
          WORKFLOW_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          leases=()
          refspecs=()
          while IFS=$'\t' read -r target expected_ref; do
            leases+=("--force-with-lease=refs/heads/$target:$expected_ref")
            refspecs+=("HEAD:refs/heads/$target")
          done < "$RUNNER_TEMP/targets"

          git -C "$BUILD_DIR" \
            -c credential.helper= \
            -c "credential.helper=!f() { printf 'username=x-access-token\npassword=%s\n' \"\$WORKFLOW_TOKEN\"; }; f" \
            -c remote.origin.pushurl="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            push --atomic "${leases[@]}" origin "${refspecs[@]}"

          awk -F'\t' 'BEGIN { print "### Published" } { print "- `" $1 "`" ($2 ? " (was " substr($2, 1, 7) ")" : " (created)") }' \
            "$RUNNER_TEMP/targets" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -rf "$SOURCE_DIR"
